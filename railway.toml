[deploy]
# Railway calls this path to decide whether a deployment succeeded.
# Must return HTTP 200 within healthcheckTimeout seconds.
healthcheckPath    = "/health"
healthcheckTimeout = 30          # seconds; SSE endpoints can be slow to start

# Restart the container automatically on non-zero exit codes.
# "on_failure" avoids restart loops when the app crashes at startup
# due to mis-configured env vars (they show up clearly in logs).
restartPolicyType       = "on_failure"
restartPolicyMaxRetries = 10
